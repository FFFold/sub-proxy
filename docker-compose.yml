services:
  sub-proxy:
    image: sub-proxy
    container_name: sub-proxy
    restart: unless-stopped
    ports:
      - "自定义端口:25500"
    environment:
      # 上游订阅链接（请替换为你的真实链接）
      - UPSTREAM_URL=https://订阅链接/sub/token
      # 自定义 User-Agent
      - CUSTOM_UA=v2rayN/7.24.4
      # 日志级别: DEBUG / INFO / WARNING / ERROR
      - LOG_LEVEL=INFO
    # 如果订阅链接是自签名证书，取消下面注释
    # command: ["python3", "sub_proxy.py", "--no-verify-ssl"]

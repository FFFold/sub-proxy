services:
  sub-proxy:
    image: ghcr.io/fffold/sub-proxy
    container_name: sub-proxy
    restart: unless-stopped
    ports:
      # 冒号左侧为主机端口，按需修改（默认 25500）
      - "25500:25500"
    environment:
      # 上游订阅链接（请替换为你的真实链接）
      - UPSTREAM_URL=https://example.com/sub/token
      # 自定义 User-Agent
      - CUSTOM_UA=v2rayN/7.24.4
      # 日志级别: DEBUG / INFO / WARNING / ERROR
      - LOG_LEVEL=INFO
    # 如果订阅链接是自签名证书，取消下面注释
    # command: ["python3", "sub_proxy.py", "--no-verify-ssl"]

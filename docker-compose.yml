services:
  sub-proxy:
    image: ghcr.io/fffold/sub-proxy
    container_name: sub-proxy
    restart: unless-stopped
    ports:
      - "25500:25500"
    environment:
      # 可选。使用路径转发（http://proxy:25500/<上游链接>）时可省略
      - UPSTREAM_URL=
      # 自定义 User-Agent
      - CUSTOM_UA=clash-verge/v2.5.3
      # 日志级别: DEBUG / INFO / WARNING / ERROR
      - LOG_LEVEL=INFO
    # 如果订阅链接是自签名证书，取消下面注释
    # command: ["python3", "sub_proxy.py", "--no-verify-ssl"]
